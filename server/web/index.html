<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>金成峰司机报表</title>
<style>
  :root {
    --green: #166d43;
    --green-light: #e8f5ee;
    --green-deep: #0f5233;
    --text: #1f2937;
    --text-sub: #6b7280;
    --border: #e5e7eb;
    --bg: #f5f7f6;
    --card: #ffffff;
    --danger: #c0392b;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; background: var(--bg); color: var(--text); }
  .hidden { display: none !important; }

  /* 登录 */
  #login { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .login-card {
    background: var(--card); border-radius: 14px; padding: 40px 36px; width: 340px;
    box-shadow: 0 8px 30px rgba(0,0,0,.08); text-align: center;
  }
  .login-card h1 { font-size: 22px; color: var(--green); margin-bottom: 6px; }
  .login-card p { color: var(--text-sub); font-size: 13px; margin-bottom: 24px; }
  .login-card input {
    width: 100%; padding: 11px 14px; border: 1px solid var(--border); border-radius: 8px;
    font-size: 15px; margin-bottom: 14px; outline: none;
  }
  .login-card input:focus { border-color: var(--green); }
  .btn {
    display: inline-block; background: var(--green); color: #fff; border: none; border-radius: 8px;
    padding: 11px 22px; font-size: 15px; cursor: pointer; transition: background .15s;
  }
  .btn:hover { background: var(--green-deep); }
  .btn:disabled { opacity: .6; cursor: not-allowed; }
  .btn-ghost { background: #fff; color: var(--green); border: 1px solid var(--green); }
  .btn-ghost:hover { background: var(--green-light); }
  .err { color: var(--danger); font-size: 13px; min-height: 18px; margin-bottom: 8px; }

  /* 主界面 */
  #app { max-width: 1080px; margin: 0 auto; padding: 18px 16px 40px; }
  header {
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
    background: var(--card); border-radius: 12px; padding: 14px 18px; margin-bottom: 14px;
    box-shadow: 0 2px 10px rgba(0,0,0,.04);
  }
  header h1 { font-size: 20px; color: var(--green); }
  .sync-link { font-size: 13px; color: var(--text-sub); }
  .sync-link a { color: var(--green); text-decoration: none; }
  .sync-link a:hover { text-decoration: underline; }

  .toolbar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    background: var(--card); border-radius: 12px; padding: 12px 16px; margin-bottom: 14px;
    box-shadow: 0 2px 10px rgba(0,0,0,.04);
  }
  .tabs { display: flex; gap: 6px; }
  .tab {
    padding: 7px 16px; border-radius: 20px; border: 1px solid var(--border); background: #fff;
    font-size: 14px; cursor: pointer; color: var(--text-sub); transition: all .15s;
  }
  .tab.active { background: var(--green); color: #fff; border-color: var(--green); }
  .date-field { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-sub); }
  .date-field input {
    border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; font-size: 13px; outline: none;
  }
  .spacer { flex: 1; }

  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 14px; }
  .card {
    background: var(--card); border-radius: 12px; padding: 16px 18px; box-shadow: 0 2px 10px rgba(0,0,0,.04);
  }
  .card .label { font-size: 13px; color: var(--text-sub); margin-bottom: 6px; }
  .card .value { font-size: 26px; font-weight: 700; color: var(--green); }
  .card .value small { font-size: 13px; font-weight: 400; color: var(--text-sub); }

  .panel { background: var(--card); border-radius: 12px; padding: 16px 18px; box-shadow: 0 2px 10px rgba(0,0,0,.04); }
  .panel h2 { font-size: 15px; color: var(--green); margin-bottom: 12px; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 9px 10px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { background: var(--green-light); color: var(--green-deep); font-weight: 600; }
  tr:hover td { background: #fafdfb; }
  .empty { text-align: center; color: var(--text-sub); padding: 40px 0; }
  .photo-thumb { width: 44px; height: 32px; object-fit: cover; border-radius: 4px; cursor: pointer; }
  .loading { text-align: center; color: var(--text-sub); padding: 30px 0; }
  .sub-title { font-size: 14px; color: var(--green-deep); margin: 2px 0 10px; }

  /* 用户管理 */
  .tag { display: inline-block; padding: 2px 9px; border-radius: 10px; font-size: 12px; white-space: nowrap; }
  .tag-admin { background: var(--green); color: #fff; }
  .tag-user { background: var(--green-light); color: var(--green-deep); border: 1px solid #bfe3d0; }
  .tag-ok { background: var(--green-light); color: #0f5233; }
  .tag-dis { background: #fdeceb; color: var(--danger); }
  .op-btn {
    border: 1px solid var(--green); color: var(--green); background: #fff; border-radius: 6px;
    padding: 3px 10px; font-size: 12px; cursor: pointer; transition: background .15s;
  }
  .op-btn:hover { background: var(--green-light); }
  .op-danger { color: var(--danger); border-color: var(--danger); }
  .op-danger:hover { background: #fdeceb; }
  .muted { color: var(--text-sub); font-size: 12px; }

  /* 弹窗 */
  .modal { position: fixed; inset: 0; background: rgba(15,23,42,.45); display: flex; align-items: center; justify-content: center; z-index: 50; }
  .modal-box { background: #fff; border-radius: 12px; padding: 22px 24px; width: 320px; box-shadow: 0 10px 40px rgba(0,0,0,.15); }
  .modal-box h3 { color: var(--green); margin-bottom: 4px; font-size: 16px; }
  .modal-box label { display: block; font-size: 13px; color: var(--text-sub); margin: 12px 0 4px; }
  .modal-box input, .modal-box select {
    width: 100%; padding: 9px 11px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; outline: none;
  }
  .modal-box input:focus, .modal-box select:focus { border-color: var(--green); }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }

  footer { text-align: center; color: var(--text-sub); font-size: 12px; margin-top: 20px; }
  @media (max-width: 640px) { .toolbar { flex-direction: column; align-items: stretch; } .spacer { display: none; } }
</style>
</head>
<body>

<!-- 登录 -->
<div id="login">
  <div class="login-card">
    <h1>金成峰司机报表</h1>
    <p>请输入访问密码（管理员可填账号以进入用户管理）</p>
    <input type="text" id="uid" placeholder="企业微信账号 userid（可选）" autocomplete="username">
    <input type="password" id="pwd" placeholder="访问密码" autocomplete="current-password">
    <div class="err" id="loginErr"></div>
    <button class="btn" id="loginBtn" style="width:100%">登 录</button>
  </div>
</div>

<!-- 报表主界面 -->
<div id="app" class="hidden">
  <header>
    <h1>金成峰司机报表</h1>
    <span class="sync-link" id="syncLink"></span>
    <button class="btn btn-ghost" id="logoutBtn">退出</button>
  </header>

  <div class="toolbar">
    <div class="tabs" id="tabs">
      <button class="tab active" data-k="trips">出车报表</button>
      <button class="tab" data-k="refuels">加油报表</button>
      <button class="tab" data-k="maintenances">保养报表</button>
      <button class="tab" data-k="summary">分组汇总</button>
      <button class="tab hidden" data-k="users" id="usersTab">用户管理</button>
    </div>
    <div class="date-field" id="dateField">
      从 <input type="date" id="from"> 至 <input type="date" id="to">
    </div>
    <span class="spacer"></span>
    <button class="btn" id="exportBtn">导出 Excel</button>
  </div>

  <div class="cards" id="cards"></div>
  <div class="panel">
    <h2 id="panelTitle">出车明细</h2>
    <div id="tableArea"><div class="loading">加载中…</div></div>
  </div>
  <footer>金成峰司机管理 · 网页端报表</footer>
</div>

<!-- 新增用户弹窗 -->
<div id="addUserModal" class="modal hidden">
  <div class="modal-box">
    <h3>新增用户</h3>
    <label>账号（userid）</label>
    <input id="nu_id" placeholder="如 ZhangSan">
    <label>姓名</label>
    <input id="nu_name" placeholder="如 张三">
    <label>角色</label>
    <select id="nu_role">
      <option value="user">普通用户</option>
      <option value="admin">管理员</option>
    </select>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeAddUser()">取消</button>
      <button class="btn" onclick="doAddUser()">保存</button>
    </div>
  </div>
</div>

<script>
var BASE = '';
var TOKEN_KEY = 'jcf_web_token';
var TABS = {
  trips: { title: '出车明细', cols: ['日期','姓名','车牌号','出发地','目的地','提交时间'] },
  refuels: { title: '加油明细', cols: ['日期','姓名','车牌号','里程(km)','行驶(km)','油价(元/L)','加油量(L)','金额(元)','油耗(L/100km)','提交时间'] },
  maintenances: { title: '保养明细', cols: ['时间','姓名','车牌号','保养项目','费用(元)','备注','照片'] },
  summary: { title: '分组汇总', cols: [] }
};
var kind = 'trips';

function fmt(v) {
  if (v === null || v === undefined || v === '') return '';
  if (typeof v === 'number') return (Math.round(v * 100) / 100).toString();
  return v;
}

function token() { return localStorage.getItem(TOKEN_KEY) || ''; }

function api(path, opts) {
  opts = opts || {};
  return fetch(BASE + path, {
    headers: Object.assign({ 'Authorization': 'Bearer ' + token(), 'Content-Type': 'application/json' }, opts.headers || {}),
    method: opts.method || 'GET',
    body: opts.body ? JSON.stringify(opts.body) : undefined
  }).then(function (r) {
    if (r.status === 401) { localStorage.removeItem(TOKEN_KEY); location.reload(); throw new Error('未登录'); }
    return r.json().then(function (d) { if (!d.ok) throw new Error(d.error || '请求失败'); return d.data; });
  });
}

function today() { return new Date().toISOString().slice(0, 10); }
function monthStart() {
  var d = new Date();
  return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-01';
}

function qs() { return '?from=' + document.getElementById('from').value + '&to=' + document.getElementById('to').value; }

/* ---------- 登录 ---------- */
function doLogin() {
  var pwd = document.getElementById('pwd').value.trim();
  var uid = document.getElementById('uid').value.trim();
  if (!pwd) { document.getElementById('loginErr').textContent = '请输入密码'; return; }
  var btn = document.getElementById('loginBtn');
  btn.disabled = true;
  document.getElementById('loginErr').textContent = '';
  fetch(BASE + '/api/web/login', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ password: pwd, userid: uid })
  }).then(function (r) { return r.json(); }).then(function (d) {
    if (!d.ok) throw new Error(d.error || '密码错误');
    localStorage.setItem(TOKEN_KEY, d.data.token);
    localStorage.setItem('jcf_web_admin', d.data.is_admin ? '1' : '0');
    localStorage.setItem('jcf_web_uid', d.data.userid || '');
    enterApp();
  }).catch(function (e) {
    document.getElementById('loginErr').textContent = e.message || '登录失败';
  }).finally(function () { btn.disabled = false; });
}

/* ---------- 主界面 ---------- */
function enterApp() {
  document.getElementById('login').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('from').value = monthStart();
  document.getElementById('to').value = today();
  var admin = localStorage.getItem('jcf_web_admin') === '1';
  var usersTab = document.getElementById('usersTab');
  if (usersTab) { usersTab.classList.toggle('hidden', !admin); }
  loadSyncStatus();
  load();
}

function loadSyncStatus() {
  api('/api/sync/status').then(function (d) {
    var el = document.getElementById('syncLink');
    if (d.ready && d.url) {
      el.innerHTML = '在线表格同步：<a href="' + d.url + '" target="_blank">打开同步表</a>（最近 ' +
        d.summary.total + ' 条，失败 ' + d.summary.fail + '）';
    } else {
      el.textContent = '在线表格同步未启用';
    }
  }).catch(function () {});
}

function renderCards(summary) {
  var html = '';
  if (kind === 'trips') {
    html += '<div class="card"><div class="label">出车总次数</div><div class="value">' + summary.total + '<small> 次</small></div></div>';
  } else if (kind === 'refuels') {
    html += '<div class="card"><div class="label">加油次数</div><div class="value">' + summary.cnt + '<small> 次</small></div></div>';
    html += '<div class="card"><div class="label">加油总金额</div><div class="value">¥' + fmt(summary.total_amount) + '</div></div>';
    html += '<div class="card"><div class="label">加油总量</div><div class="value">' + fmt(summary.total_liters) + '<small> L</small></div></div>';
    html += '<div class="card"><div class="label">平均油价</div><div class="value">' + fmt(summary.avg_price) + '<small> 元/L</small></div></div>';
    html += '<div class="card"><div class="label">平均油耗</div><div class="value">' + fmt(summary.avg_fuel) + '<small> L/100km</small></div></div>';
  } else {
    html += '<div class="card"><div class="label">保养次数</div><div class="value">' + summary.cnt + '<small> 次</small></div></div>';
    html += '<div class="card"><div class="label">保养总费用</div><div class="value">¥' + fmt(summary.total_cost) + '</div></div>';
  }
  document.getElementById('cards').innerHTML = html;
}

function rowCells(item) {
  if (kind === 'trips') {
    return [item.trip_date, item.name, item.plate, item.origin, item.destination, item.created_at];
  }
  if (kind === 'refuels') {
    return [item.refuel_date, item.name, item.plate, fmt(item.odometer), fmt(item.travel_km), fmt(item.oil_price),
            fmt(item.liters), fmt(item.amount), fmt(item.fuel_consumption), item.created_at];
  }
  return [item.maintain_time, item.name, item.plate, item.items, fmt(item.cost), item.remark || '',
          item.photo ? '<img class="photo-thumb" src="/uploads/' + item.photo + '" onclick="window.open(\'/uploads/' + item.photo + '\')">' : ''];
}

function loadSummary() {
  var area = document.getElementById('tableArea');
  api('/api/summary' + qs()).then(function (d) {
    var persons = d.by_person || [];
    var vehicles = d.by_vehicle || [];
    document.getElementById('cards').innerHTML =
      '<div class="card"><div class="label">涉及人数</div><div class="value">' + persons.length + '<small> 人</small></div></div>' +
      '<div class="card"><div class="label">涉及车辆</div><div class="value">' + vehicles.length + '<small> 辆</small></div></div>';
    var html = '<h3 class="sub-title">按人汇总（出车/加油/保养）</h3>';
    if (!persons.length) {
      html += '<div class="empty">暂无数据</div>';
    } else {
      html += '<div class="table-wrap"><table><thead><tr><th>姓名</th><th>出车(次)</th><th>加油(次)</th>' +
        '<th>加油金额(元)</th><th>保养(次)</th><th>保养费用(元)</th><th>记录合计</th></tr></thead><tbody>';
      persons.forEach(function (p) {
        html += '<tr><td><b>' + p.name + '</b></td><td>' + p.trip_cnt + '</td><td>' + p.refuel_cnt +
          '</td><td>¥' + fmt(p.refuel_amount) + '</td><td>' + p.maintain_cnt +
          '</td><td>¥' + fmt(p.maintain_cost) + '</td><td><b>' + p.total + '</b></td></tr>';
      });
      html += '</tbody></table></div>';
    }
    html += '<h3 class="sub-title" style="margin-top:18px">按车辆汇总（出车/加油/保养）</h3>';
    if (!vehicles.length) {
      html += '<div class="empty">暂无数据</div>';
    } else {
      html += '<div class="table-wrap"><table><thead><tr><th>车牌号</th><th>出车(次)</th><th>加油(次)</th>' +
        '<th>加油金额(元)</th><th>加油量(L)</th><th>保养(次)</th><th>保养费用(元)</th><th>记录合计</th></tr></thead><tbody>';
      vehicles.forEach(function (v) {
        html += '<tr><td><b>' + v.plate + '</b></td><td>' + v.trip_cnt + '</td><td>' + v.refuel_cnt +
          '</td><td>¥' + fmt(v.refuel_amount) + '</td><td>' + fmt(v.refuel_liters) +
          '</td><td>' + v.maintain_cnt + '</td><td>¥' + fmt(v.maintain_cost) +
          '</td><td><b>' + v.total + '</b></td></tr>';
      });
      html += '</tbody></table></div>';
    }
    area.innerHTML = html;
  }).catch(function (e) { area.innerHTML = '<div class="empty">加载失败：' + e.message + '</div>'; });
}

/* ---------- 用户管理 ---------- */
function loadUsers() {
  var area = document.getElementById('tableArea');
  api('/api/admin/users').then(function (d) {
    var users = d.users || [];
    var disCnt = users.filter(function (u) { return u.status === 'disabled'; }).length;
    document.getElementById('cards').innerHTML =
      '<div class="card"><div class="label">用户总数</div><div class="value">' + users.length + '<small> 人</small></div></div>' +
      '<div class="card"><div class="label">管理员</div><div class="value">' + d.admin_count + '<small> 人</small></div></div>' +
      '<div class="card"><div class="label">已禁用</div><div class="value">' + disCnt + '<small> 人</small></div></div>';
    var html = '<div style="margin-bottom:10px"><button class="btn" onclick="showAddUser()">+ 新增用户</button></div>';
    if (!users.length) {
      html += '<div class="empty">暂无用户，司机登录后会自动登记，也可手动新增</div>';
    } else {
      html += '<div class="table-wrap"><table><thead><tr>' +
        '<th>姓名</th><th>账号(userid)</th><th>角色</th><th>状态</th>' +
        '<th>出车/加油/保养</th><th>注册时间</th><th>最后登录</th><th>操作</th></tr></thead><tbody>';
      var me = localStorage.getItem('jcf_web_uid') || '';
      users.forEach(function (u) {
        var isMe = u.userid === me;
        var roleTag = u.role === 'admin' ? '<span class="tag tag-admin">管理员</span>' : '<span class="tag tag-user">普通用户</span>';
        var stTag = u.status === 'disabled' ? '<span class="tag tag-dis">已禁用</span>' : '<span class="tag tag-ok">正常</span>';
        var ops = '';
        if (u.role === 'admin') {
          ops += isMe ? '<span class="muted">当前账号</span>' :
            '<button class="op-btn" onclick="setRole(\'' + u.userid + '\',\'user\')">取消管理员</button>';
        } else {
          ops += '<button class="op-btn" onclick="setRole(\'' + u.userid + '\',\'admin\')">设为管理员</button>';
        }
        ops += ' ';
        if (u.status === 'disabled') {
          ops += '<button class="op-btn" onclick="setStatus(\'' + u.userid + '\',\'active\')">启用</button>';
        } else if (!isMe) {
          ops += '<button class="op-btn op-danger" onclick="setStatus(\'' + u.userid + '\',\'disabled\')">禁用</button>';
        }
        html += '<tr><td><b>' + u.name + '</b></td><td>' + u.userid + '</td><td>' + roleTag +
          '</td><td>' + stTag + '</td><td>' + u.trip_cnt + ' / ' + u.refuel_cnt + ' / ' + u.maintain_cnt +
          '</td><td>' + (u.created_at || '') + '</td><td>' + (u.last_login_at || '') +
          '</td><td>' + ops + '</td></tr>';
      });
      html += '</tbody></table></div>';
    }
    area.innerHTML = html;
  }).catch(function (e) { area.innerHTML = '<div class="empty">加载失败：' + e.message + '</div>'; });
}

function setRole(uid, role) {
  var act = role === 'admin' ? '设为管理员' : '取消管理员';
  if (!confirm('确认' + act + '：' + uid + '？')) return;
  api('/api/admin/users/' + encodeURIComponent(uid), { method: 'PATCH', body: { role: role } })
    .then(function () { loadUsers(); })
    .catch(function (e) { alert(e.message); });
}

function setStatus(uid, status) {
  var act = status === 'disabled' ? '禁用' : '启用';
  if (!confirm('确认' + act + '账号 ' + uid + '？' + (status === 'disabled' ? '禁用后该用户将无法提交出车/加油/保养。' : ''))) return;
  api('/api/admin/users/' + encodeURIComponent(uid), { method: 'PATCH', body: { status: status } })
    .then(function () { loadUsers(); })
    .catch(function (e) { alert(e.message); });
}

function showAddUser() { document.getElementById('addUserModal').classList.remove('hidden'); }
function closeAddUser() { document.getElementById('addUserModal').classList.add('hidden'); }

function doAddUser() {
  var uid = document.getElementById('nu_id').value.trim();
  var name = document.getElementById('nu_name').value.trim();
  var role = document.getElementById('nu_role').value;
  if (!uid) { alert('请填写账号(userid)'); return; }
  api('/api/admin/users', { method: 'POST', body: { userid: uid, name: name, role: role } })
    .then(function () { closeAddUser(); loadUsers(); })
    .catch(function (e) { alert(e.message); });
}

function load() {
  var area = document.getElementById('tableArea');
  area.innerHTML = '<div class="loading">加载中…</div>';
  document.getElementById('panelTitle').textContent = (TABS[kind] && TABS[kind].title) || '用户管理';
  var exportBtn = document.getElementById('exportBtn');
  var dateField = document.getElementById('dateField');
  var noExtra = (kind === 'summary' || kind === 'users');
  exportBtn.classList.toggle('hidden', noExtra);
  if (kind === 'users') { dateField.classList.add('hidden'); loadUsers(); return; }
  dateField.classList.remove('hidden');
  if (kind === 'summary') { loadSummary(); return; }
  api('/api/reports/' + kind + qs()).then(function (d) {
    renderCards(d.summary);
    var rows = d.detail || [];
    var cols = TABS[kind].cols;
    if (!rows.length) { area.innerHTML = '<div class="empty">暂无数据</div>'; return; }
    var html = '<div class="table-wrap"><table><thead><tr>';
    cols.forEach(function (c) { html += '<th>' + c + '</th>'; });
    html += '</tr></thead><tbody>';
    rows.forEach(function (item) {
      html += '<tr>';
      rowCells(item).forEach(function (c) { html += '<td>' + c + '</td>'; });
      html += '</tr>';
    });
    html += '</tbody></table></div>';
    area.innerHTML = html;
  }).catch(function (e) { area.innerHTML = '<div class="empty">加载失败：' + e.message + '</div>'; });
}

function doExport() {
  var btn = document.getElementById('exportBtn');
  btn.disabled = true;
  btn.textContent = '导出中…';
  fetch(BASE + '/api/export/' + kind + qs(), { headers: { 'Authorization': 'Bearer ' + token() } })
    .then(function (r) {
      if (r.status === 401) { localStorage.removeItem(TOKEN_KEY); location.reload(); throw new Error('未登录'); }
      if (!r.ok) return r.json().then(function (d) { throw new Error(d.error || '导出失败'); });
      var disp = (r.headers.get('Content-Disposition') || '').match(/filename\*=UTF-8''([^;]+)/i);
      var fname = disp ? decodeURIComponent(disp[1]) : (kind + '.xlsx');
      return r.blob().then(function (blob) { return { blob: blob, fname: fname }; });
    })
    .then(function (res) {
      var a = document.createElement('a');
      a.href = URL.createObjectURL(res.blob);
      a.download = res.fname;
      document.body.appendChild(a);
      a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    })
    .catch(function (e) { alert(e.message); })
    .finally(function () { btn.disabled = false; btn.textContent = '导出 Excel'; });
}

/* ---------- 事件 ---------- */
document.getElementById('loginBtn').addEventListener('click', doLogin);
document.getElementById('pwd').addEventListener('keydown', function (e) { if (e.key === 'Enter') doLogin(); });
document.getElementById('logoutBtn').addEventListener('click', function () {
  localStorage.removeItem(TOKEN_KEY);
  localStorage.removeItem('jcf_web_admin');
  localStorage.removeItem('jcf_web_uid');
  location.reload();
});
document.getElementById('addUserModal').addEventListener('click', function (e) {
  if (e.target === this) closeAddUser();
});
document.getElementById('tabs').addEventListener('click', function (e) {
  var btn = e.target.closest('.tab');
  if (!btn) return;
  document.querySelectorAll('.tab').forEach(function (t) { t.classList.remove('active'); });
  btn.classList.add('active');
  kind = btn.dataset.k;
  load();
});
document.getElementById('from').addEventListener('change', load);
document.getElementById('to').addEventListener('change', load);
document.getElementById('exportBtn').addEventListener('click', doExport);

/* ---------- 启动 ---------- */
if (token()) { enterApp(); }
</script>
